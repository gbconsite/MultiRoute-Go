name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      # Set up Python
      - uses: actions/setup-python@v2
        with:
          python-version: 3.11

      # Install uv and set up a virtual environment
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.cargo/env
          uv venv --python 3.11
          uv pip install "zensical==0.0.67" "ghp-import==2.1.0"

      # Build with Zensical on pull requests and pushes
      - run: uv run zensical build --clean

      # Publish only on pushes to main
      - name: Publish generated site to gh-pages
        if: github.event_name == 'push'
        run: uv run ghp-import --no-jekyll --push --force site

      # The remaining steps update the published branch with compressed assets.
      - name: Check out published pages
        if: github.event_name == 'push'
        uses: actions/checkout@v2
        with:
          ref: gh-pages

      - name: Commit pages without compression
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "pages without compression"
          branch: gh-pages
          push_options: '--force'

      # Node setup
      - name: Set up Node
        if: github.event_name == 'push'
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      # Install gzipper with npm
      - name: Install compression dependencies
        if: github.event_name == 'push'
        run: |
          npm install
          npm install -g gzipper@7.2.0

      # Compress all files in all directories
      - name: Compress published pages
        if: github.event_name == 'push'
        run: gzipper compress --include htm,html,css,js,svg,xml,map,json,img,png,jpg,jpeg --zopfli --brotli --remove-larger .

      # Commit compressed files
      - name: Commit compressed pages
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "pages with compression"
          branch: gh-pages
          push_options: '--force'
